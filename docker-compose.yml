x-object-storage: &object-storage
  S3_BUCKET: ${S3_BUCKET:-ai-book-maker}
  S3_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000
  S3_FORCE_PATH_STYLE: "true"
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-bookmaker}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-bookmaker-local-only}

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [server, /data, --console-address, ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bookmaker}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bookmaker-local-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bookmaker}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bookmaker-local-only}
      S3_BUCKET: ${S3_BUCKET:-ai-book-maker}
    depends_on:
      minio:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bookmaker
      POSTGRES_USER: bookmaker
      POSTGRES_PASSWORD: bookmaker
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmaker -d bookmaker"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "18083:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ocr:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    init: true
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "127.0.0.1:18084:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/docs', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      retries: 20

  api:
    build:
      context: .
      target: dev
    # Chromium is now pooled rather than launched per render, so a zombie
    # renderer lives for the process lifetime instead of milliseconds. The
    # entrypoint shell is PID 1 and does not reap; tini does.
    init: true
    entrypoint: ["/bin/sh", "/app/scripts/docker-dev-entrypoint.sh"]
    command: ["pnpm", "--filter", "@book-maker/api", "dev"]
    env_file:
      - .env
    environment:
      CI: "true"
      <<: *object-storage
      DATABASE_URL: postgresql://bookmaker:bookmaker@postgres:5432/bookmaker?schema=public
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 4001
      BOOK_STORAGE_DIR: /app/storage/books
      IMAGE_STORAGE_DIR: /app/storage/images
      ATTACHMENT_STORAGE_DIR: /app/storage/attachments
      DEV_WATCH_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      DEV_PNPM_FILTER: "@book-maker/api..."
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/apps/api/src
        - action: sync
          path: ./packages/core/src
          target: /app/packages/core/src
        - action: sync
          path: ./packages/db/src
          target: /app/packages/db/src
        - action: sync
          path: ./packages/storage/src
          target: /app/packages/storage/src
        - action: sync
          path: ./scripts
          target: /app/scripts
    ports:
      - "4001:4001"
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm/store
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/worker/node_modules
      - /app/apps/web/node_modules
      - /app/packages/core/node_modules
      - /app/packages/db/node_modules
      - /app/packages/storage/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: dev
    # See the api service: a pooled Chromium needs something to reap it.
    init: true
    entrypoint: ["/bin/sh", "/app/scripts/docker-dev-entrypoint.sh"]
    command: ["pnpm", "--filter", "@book-maker/worker", "dev"]
    env_file:
      - .env
    environment:
      CI: "true"
      <<: *object-storage
      DATABASE_URL: postgresql://bookmaker:bookmaker@postgres:5432/bookmaker?schema=public
      REDIS_URL: redis://redis:6379
      BOOK_STORAGE_DIR: /app/storage/books
      IMAGE_STORAGE_DIR: /app/storage/images
      ATTACHMENT_STORAGE_DIR: /app/storage/attachments
      SOURCE_OCR_URL: http://ocr:8080
      SOURCE_OCR_TIMEOUT_MS: 600000
      DEV_WATCH_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      DEV_PNPM_FILTER: "@book-maker/worker..."
    develop:
      watch:
        - action: sync
          path: ./apps/worker/src
          target: /app/apps/worker/src
        - action: sync
          path: ./packages/core/src
          target: /app/packages/core/src
        - action: sync
          path: ./packages/db/src
          target: /app/packages/db/src
        - action: sync
          path: ./packages/storage/src
          target: /app/packages/storage/src
        - action: sync
          path: ./scripts
          target: /app/scripts
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm/store
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/worker/node_modules
      - /app/apps/web/node_modules
      - /app/packages/core/node_modules
      - /app/packages/db/node_modules
      - /app/packages/storage/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # OCR is optional: the worker can fall back to Gemini while local OCR
      # starts or is unavailable. Do not gate worker startup on OCR health.

  web:
    build:
      context: .
      target: dev
    entrypoint: ["/bin/sh", "/app/scripts/docker-dev-entrypoint.sh"]
    command: ["pnpm", "--filter", "@book-maker/web", "dev"]
    environment:
      CI: "true"
      VITE_API_BASE_URL: http://localhost:4001
      DEV_WATCH_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # No `...` suffix, unlike api and worker: those run core's source through
      # node and need its dependencies installed, but web only *bundles* it.
      # `@book-maker/core` is a workspace dependency here for its narrow subpath
      # exports — `scripts/check-core-subpaths.mjs` prints the current list, and
      # every one of them is a module whose runtime closure is empty — so pnpm
      # still links `apps/web/node_modules/@book-maker/core` and vite resolves
      # them straight out of the bind-mounted source, with no import statement
      # left to resolve. That gate is what keeps this filter safe, from both
      # ends: it fails a subpath that grows a runtime import, and it fails an
      # import of the barrel from here. Adding the suffix selects packages/core
      # as a project to install *for*, which drags puppeteer, sharp, openai and
      # md-to-pdf into this container to compile a few const arrays down to a
      # handful of strings: 437 packages instead of 263.
      #
      # It is also a dev server and nothing else: `pnpm typecheck` and `pnpm
      # build` cannot run in here, because tsc follows the subpath types into
      # core's zod and packages/core/node_modules is empty. Run those on the
      # host. See apps/web/CLAUDE.md.
      DEV_PNPM_FILTER: "@book-maker/web"
      DEV_DEPS_PACKAGE: "vite"
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/apps/web/src
        - action: sync
          path: ./apps/web/vite.config.ts
          target: /app/apps/web/vite.config.ts
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm/store
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/worker/node_modules
      - /app/apps/web/node_modules
      - /app/packages/core/node_modules
      - /app/packages/db/node_modules
      - /app/packages/storage/node_modules
    depends_on:
      - api

volumes:
  minio-data:
  postgres-data:
  pgadmin-data:
  pnpm-store:
