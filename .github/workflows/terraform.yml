# PR:  terraform fmt → validate → plan  (commented on the PR)
# merge to master: terraform apply → build/smoke test Docker images → deploy to EC2
#   (not for a push that changes only docs or Markdown; see paths-ignore)
#
# Repo secrets required:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY

name: Terraform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "*.tf"
      - "**/*.tf"
      - ".terraform.lock.hcl"
      - "scripts/ensure-tf-backend.sh"
      # Run on the host by root-filesystem.tf and swap.tf's SSM associations.
      - "scripts/prepare-production-*.sh"
      # Run on the host by deploy.yml, and tested by the validate job below.
      - "scripts/deploy-production.sh"
      - "scripts/worker-healthcheck.sh"
      - "scripts/test_*.py"
      - ".github/workflows/terraform.yml"
  push:
    branches: [master]
    # Every deploy is a short outage (docs/deployment.md, "Release behavior"),
    # and none of these reach an image or the infrastructure. Flutter sources
    # are built separately and their web output is included in the web image.
    # A push is skipped only when *every*
    # file it changes matches; one that also touches anything else applies and
    # deploys as before. Actions → Terraform → Run workflow deploys by hand.
    paths-ignore:
      - "docs/**"
      - ".scratch/**"
      - ".claude/**"
      - "**/*.md"

concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.16.3"
  AWS_REGION: eu-central-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_IN_AUTOMATION: "true"
  # Overrides main.tf's default, so the two must move together.
  TF_VAR_root_volume_size: ${{ vars.ROOT_VOLUME_SIZE || '30' }}
  # Where the CloudWatch alarms in monitoring.tf are emailed (repository
  # variable ALERT_EMAIL). Empty creates the SNS topic with no subscriber.
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL || '' }}

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Disk and swap preparation, the deploy's cutover order and its failure
      # paths, and the worker's healthcheck: scripts/test_*.py.
      - name: Test production host scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  plan:
    name: terraform plan
    if: github.event_name == 'pull_request'
    needs: [fmt, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Require AWS credentials
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Add repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY"
            exit 1
          fi
      - name: Ensure remote state bucket
        run: bash scripts/ensure-tf-backend.sh
      - run: terraform init -input=false
      - name: terraform plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_FILE: plan.txt
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const limit = 60000;
            const plan = raw.length > limit ? `${raw.slice(0, limit)}\n... truncated ...` : raw;
            const body = `<!-- terraform-plan -->\n### Terraform plan\n\`\`\`\n${plan}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes('<!-- terraform-plan -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply:
    name: terraform apply
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [fmt, validate]
    environment: production
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.outputs.outputs.instance_id }}
      app_repository: ${{ steps.outputs.outputs.app_repository }}
      web_repository: ${{ steps.outputs.outputs.web_repository }}
      env_parameter: ${{ steps.outputs.outputs.env_parameter }}
      assets_bucket: ${{ steps.outputs.outputs.assets_bucket }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Require AWS credentials
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Add repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY"
            exit 1
          fi
      - name: Ensure remote state bucket
        run: bash scripts/ensure-tf-backend.sh
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -out=tfplan
      - run: terraform apply -input=false -auto-approve tfplan
      - id: outputs
        name: Read deployment outputs
        run: |
          {
            echo "instance_id=$(terraform output -raw instance_id)"
            echo "app_repository=$(terraform output -raw app_repository)"
            echo "web_repository=$(terraform output -raw web_repository)"
            echo "env_parameter=$(terraform output -raw production_env_parameter)"
            echo "assets_bucket=$(terraform output -raw assets_bucket)"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Docker applications
    needs: apply
    uses: ./.github/workflows/deploy.yml
    with:
      instance_id: ${{ needs.apply.outputs.instance_id }}
      app_repository: ${{ needs.apply.outputs.app_repository }}
      web_repository: ${{ needs.apply.outputs.web_repository }}
      env_parameter: ${{ needs.apply.outputs.env_parameter }}
      assets_bucket: ${{ needs.apply.outputs.assets_bucket }}
    secrets: inherit
