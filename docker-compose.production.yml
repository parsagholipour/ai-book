name: book-maker

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE to the app image digest}
  restart: unless-stopped
  env_file:
    - .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://bookmaker:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD}@postgres:5432/bookmaker?schema=public
    REDIS_URL: redis://redis:6379
    API_HOST: 0.0.0.0
    API_PORT: "4001"
    PUBLIC_API_URL: ${PUBLIC_API_URL:?Set the externally reachable API origin}
    WEB_PASSWORD: ${WEB_PASSWORD:?Set an operator password}
    BOOK_STORAGE_DIR: /app/storage/books
    IMAGE_STORAGE_DIR: /app/storage/images
    VOICE_STORAGE_DIR: /app/storage/voice
    AUDIO_STORAGE_DIR: /app/storage/audio
    ATTACHMENT_STORAGE_DIR: /app/storage/attachments
    S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET from the Terraform assets_bucket output}
    S3_REGION: ${S3_REGION:-eu-central-1}
    MAX_PARALLEL_PAGE_JOBS: ${MAX_PARALLEL_PAGE_JOBS:-1}
    MAX_PARALLEL_IMAGE_JOBS: ${MAX_PARALLEL_IMAGE_JOBS:-1}
  # Containers only keep disposable render scratch; durable files are in S3.
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookmaker
      POSTGRES_USER: bookmaker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bookmaker -d bookmaker"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  migrate:
    <<: *app
    restart: "no"
    command: [sh, -c, "pnpm db:deploy && pnpm db:seed"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    working_dir: /app/apps/api
    command: [node, --import, tsx, src/server.ts]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    working_dir: /app/apps/worker
    command: [node, --import, tsx, src/index.ts]
    stop_grace_period: 5m
    shm_size: 256mb
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "import { Queue } from 'bullmq'; const q = new Queue('book-maker', { connection: { host: 'redis', port: 6379 } }); try { process.exitCode = (await q.getWorkers()).length > 0 ? 0 : 1; } finally { await q.close(); }"
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # HTTP only, on the Compose network; Caddy is the only host-published edge.
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the web image digest}
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # TLS termination for tomeza.ravanix.app (deploy/Caddyfile). Certificates
  # live in caddy-data so Let's Encrypt renewals survive redeploys.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Let's Encrypt expiry/problem notices. Not a secret.
      ACME_EMAIL: ${ACME_EMAIL:-support@ravanix.app}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    # Through Caddy's private-only HTTP site to Nginx to the API.
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/health]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  caddy-data:
