# Behind the Caddy edge (deploy/Caddyfile) the client's address and scheme
# arrive in these headers; pass them on instead of the edge container's
# address and plain http. Without an edge (the smoke test) the old values
# apply. In production Nginx has no host port, so only the edge can set them.
map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # Resolve again after Compose replaces the API container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:4001;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # /s/ is the public share surface (apps/api/src/mobile/shares/): the page,
    # its PDF, cover and report route, and its vendored viewer under /s/_/.
    # A public path missing here works under `pnpm dev` and serves the console
    # in production.
    location ~ ^/(api|docs|s)(/|$)|^/assets/(images|voice|audio)(/|$) {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # $uri/index.html before $uri/: the legal pages are prerendered as
    # <path>/index.html, and the directory form would answer /terms with a 301
    # to /terms/ instead of the policy text. Everything else is the SPA.
    # The headers match what the API sets on the console and /docs
    # (apps/api/src/auth.ts) and are set only here: proxied responses above carry
    # the API's own. SAMEORIGIN, not DENY: the console's PDF preview frames a
    # same-origin export URL.
    location / {
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}

# Flutter product app. The operator console keeps the default virtual host.
server {
    listen 80;
    server_name app.tomeza.ravanix.app;
    root /usr/share/nginx/flutter;
    index index.html;
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:4001;
    gzip on;
    gzip_types application/javascript application/wasm application/json text/css;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/api/(mobile(/|$)|health$|ready$)|^/assets/(images|voice|audio)(/|$) {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ~ ^/(api|docs)(/|$) {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}
